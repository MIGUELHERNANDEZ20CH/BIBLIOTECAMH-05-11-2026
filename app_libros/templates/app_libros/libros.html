<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary fw-bold">📖 Catálogo de Libros</h2>
            <a href="/" class="btn btn-outline-secondary btn-sm">Volver al Inicio</a>
        </div>
        <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr><th>ISBN</th><th>Título</th><th>Descripción</th><th>Categoría</th></tr>
                </thead>
                <tbody>
                    {% for libro in libros %}
                    <tr>
                        <td><code>{{ libro.isbn }}</code></td>
                        <td>{{ libro.titulo }}</td>
                        <td>{{ libro.descripcion }}</td>
                        <td><span class="badge bg-secondary">{{ libro.categoria }}</span></td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">No hay libros registrados en la base de datos.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
